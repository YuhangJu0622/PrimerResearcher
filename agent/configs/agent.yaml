# P0 Agent-only configuration. Credentials are injected exclusively via environment variables.
stage: agent
model:
  id: Qwen/Qwen3-8B
  revision: null  # set to the served model revision once the endpoint exposes it
  # Streaming keeps timeout as a per-chunk gap bound rather than total
  # generation time, so 120s tolerates long upstream stalls while allowing
  # normal thinking and token emission to continue.
  timeout_seconds: 120
  # Lowered from 5: a deterministic stall fails every retry, so extra attempts
  # only burn wall-clock.  2 retries still covers genuine transient faults.
  max_retries: 2
  temperature: 0.6
  top_p: 0.95
  max_output_tokens: 4096
  enable_thinking: true
tool:
  name: web_search
  schema_version: web_search/v1
  cache_mode: read_write
  cache_namespace: agent-dev/v1
  cache_path: cache/agent/web_search.sqlite3
  timeout_seconds: 180
  connect_timeout_seconds: 5
  read_timeout_seconds: 30
  # Evidence extraction streams responses, so this bounds the gap between
  # stream chunks rather than the entire generation. Do not reuse read_timeout.
  summary_timeout_seconds: 120
  retry_count: 1
  serper_same_key_max_retries: 3
  serper_max_key_switches: 5
  serper_retry_base_seconds: 0.25
  jina_enabled: true
  visit_stage_timeout_seconds: 60
  # Direct HTTP: first attempt plus one retry. Jina calls are single-shot.
  visit_max_attempts: 2
  visit_retry_delays_seconds: [0.5]
  concurrency: 20
  min_page_chars: 100
  max_page_chars: 50000
  max_snippet_chars: 300
  max_evidence_chars: 500
  max_output_chars: 4000
runtime:
  run_root: runs
  max_tool_rounds: 10
  log_level: INFO
  as_of_time: null
  # This is the serving endpoint's limit, not tokenizer_config.json's 131072 declaration.
  max_context_tokens: 32768
  tokenizer_path: agent/assets/qwen3-tokenizer
  # Exact tokenizer/template token count that activates finalization.
  # 30000 + 2048 final-answer reserve + 720 template/retry allowance = 32768.
  forced_final_trigger_tokens: 30000
  forced_final_attempts: 2
  forced_final_answer_reserve_tokens: 2048
  forced_final_overhead_tokens: 720
  batch_concurrency: 5
  sample_retries: 1
